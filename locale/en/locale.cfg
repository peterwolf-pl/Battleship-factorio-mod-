[mod-setting-description]
battleship-speed-multiplier=Multiplier applied to the battleship's max speed.
patrol-boat-speed-multiplier=Multiplier applied to the patrol boat's max speed.
patrol-boat-missile-range-multiplier=Multiplier applied to the patrol boat missile turret range.
battleship-radar-range=Charting range around battleships (in tiles).
patrol-boat-radar-range=Charting range around patrol boats (in tiles).

battleship-debug=Print extra debug information to the log.
battleship-debug-global=Enable debug output for all players on this map.
battleship-patrol-follow-min-distance=Preferred minimum distance (tiles) when patrol boats follow their guarded target.
battleship-patrol-follow-max-distance=Preferred maximum distance (tiles) when patrol boats follow their guarded target.
battleship-patrol-follow-step=How quickly patrol boats adjust distance to the guarded target.
battleship-escort-update-ticks=How often escort movement and separation are updated (in ticks) for this map.
battleship-escort-min-separation-tiles=Minimum separation (tiles) between escort boats when following the same target.
battleship-escort-avoid-strength=Strength of the separation steering used to avoid clustering.
battleship-ammo-refill-ticks=How often battleship ammo is refilled from cargo (in ticks) for this map.
patrol-boat-ammo-refill-ticks=How often patrol boat ammo is refilled from cargo (in ticks) for this map.
battleship-radar-chart-ticks=How often radar charting updates run (in ticks) for this map.
battleship-radar-min-move-for-rechart=Minimum movement (tiles) before radar triggers a new chart update.
battleship-force-sync-ticks=How often forces are synced (in ticks) for this map.
